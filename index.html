const imp=f=>f&&setAudio(f);
async function toggleRec(){try{if(recOn){rec.stop();recOn=false;return}const s=await navigator.mediaDevices.getUserMedia({audio:true}),mt=['audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));
rec=new MediaRecorder(s,mt?{mimeType:mt}:{});ch=[];rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());setAudio(new Blob(ch,{type:rec.mimeType}))};rec.start();recOn=true;ui()}catch(e){msg='Micro indisponible ('+(e.name||e)+') : utilise « Importer un audio » (Dictaphone).';recOn=false;ui()}}
async function go(){const p=P();msg='Création…';ui();try{p.video=await render(p);msg='Vidéo prête.';await save()}catch(e){msg='Erreur : '+e.message}ui()}
async function share(){const p=P(),f=new File([p.video],p.name+'.'+ext(p.video),{type:p.video.type});try{await navigator.share({files:[f]})}catch(e){msg='Partage indisponible : appuie longuement sur la vidéo.';ui()}}
async function addChar(fl){const n=document.getElementById('cn').value.trim()||'Perso '+(Object.keys(S.chars).length+1),o={};for(const f of fl)o[f.name]=f;
if(!Object.keys(o).some(k=>!/^[A-HX]\.\w+$/i.test(k)&&!/yeux/i.test(k))||!exprs0(o)){msg='Il manque le visage ou les yeux.';ui();return}S.chars[n]=o;const p=P();if(p){p.char=n;p.expr=exprs(n).find(b=>/ouvert/i.test(b))||exprs(n)[0]}await save();ui()}
const exprs0=o=>Object.keys(o).some(k=>/yeux/i.test(k)&&!/ferm/i.test(k));
